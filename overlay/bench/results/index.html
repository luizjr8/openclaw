<script type="text/babel" data-src-loc="6974:7000:47492">
  const { useState, useEffect, useMemo, useCallback } = React;

  const BENCHMARK_FILE = 'benchmark.json';

  /* ── Groups (derivados de raw.meta.groups; fallback vazio para runs antigas) ── */
  function buildGroups(raw) {
    const metaGroups = raw?.meta?.groups;
    if (!metaGroups?.length) return [];
    return metaGroups.map(g => {
      const [r, gv, b] = hexRgb(g.color);
      return { ...g, bg: `rgba(${r},${gv},${b},0.07)` };
    });
  }
  // Placeholder inicial — substituído em App após carregar o JSON
  let GROUPS = [];
  let TASK_NAMES = {};

  /* ── Helpers ─────────────────────────────────── */
  function parseModel(key) {
    // key: "openrouter_qwen_qwen3.6-35b-a3b" or similar
    const parts = key.split('_');
    const start = parts[0] === 'openrouter' ? 1 : 0;
    const provider = parts[start] || '?';
    const modelPart = parts.slice(start+1).join('-') || parts[start] || key;
    const name = provider + '/' + modelPart;
    const pm = modelPart.match(/(\d+\.?\d*)[Bb]/i);
    const params = pm ? pm[0].toUpperCase() : '?';
    return { key, name, params, quant: provider };
  }

  function fmtTs(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})
         + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }

  function fmtKey(k) {
    return k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  }

  function computeStats(modelos, selTs) {
    return Object.entries(modelos).map(([k,v]) => {
      const runs = v.runs.filter(r => selTs.has(r.timestamp));
      if (!runs.length) return null;
      const parsed = parseModel(k);
      const tasks = {};
      const allKeys = [...new Set(runs.flatMap(r => Object.keys(r.respostas||{})))];
      allKeys.forEach(tk => {
        const items = runs.filter(r => r.respostas&&r.respostas[tk]).map(r => r.respostas[tk]);
        if (!items.length) return;
        const avgNum = fn => { const vs=items.map(fn).filter(x=>x!=null&&!isNaN(x)); return vs.length?vs.reduce((s,v)=>s+v,0)/vs.length:0; };
        const notaVals = items.map(x=>x.avaliacao?.nota_geral).filter(x=>x!=null);
        const dur_avg = avgNum(x => x.metricas?.duration_ms ? x.metricas.duration_ms/1000 : null);
        const tok_avg      = avgNum(x => x.metricas?.tokens?.output_tokens || x.metricas?.tokens?.total_tokens || null);
        const inputTok_avg = avgNum(x => x.metricas?.tokens?.input_tokens  || null);
        const outputTok_avg= avgNum(x => x.metricas?.tokens?.output_tokens || null);
        // Normaliza avaliação do formato lzbot → formato viewer
        const rawAv = items[0].avaliacao;
        const avaliacao = rawAv ? {
          nota_geral: rawAv.nota_geral,
          resumo: rawAv.justificativa || rawAv.resumo || '',
          criterios: Object.fromEntries([
            ...(rawAv.criterios_atendidos||[]).map((c,i)=>[`✓_${i}`,{nota:10,justificativa:String(c)}]),
            ...(rawAv.criterios_faltando||[]).map((c,i)=>[`✗_${i}`,{nota:0,justificativa:String(c)}]),
          ]),
        } : null;
        const hasError = items[0].metricas && 'erro' in items[0].metricas;
        tasks[tk] = {
          nome:      TASK_NAMES[tk] || tk,
          tps:       dur_avg,
          tokens:    tok_avg,
          inputTok:  inputTok_avg,
          outputTok: outputTok_avg,
          tempo:     dur_avg,
          notaGeral: notaVals.length ? notaVals.reduce((a,b)=>a+b,0)/notaVals.length : null,
          avaliacao,
          resposta:       items[0].resposta || '',
          prompt:         items[0].prompt || '',
          prompt_analise: items[0].prompt_analise || '',
          artefatos: items[0].artefatos || [],
          hasError,
          erroMsg:   hasError ? String(items[0].metricas.erro).slice(0,200) : null,
        };
      });
      return { ...parsed, tasks };
    }).filter(Boolean);
  }

  /* Agrega tokens, tempo e nota de todos os modelos num run */
  function computeRunStats(raw, ts) {
    let totalTokens=0, totalMs=0, notaSum=0, notaCount=0, errorCount=0, taskCount=0;
    Object.values(raw.modelos).forEach(m => {
      const run = m.runs.find(r => r.timestamp === ts);
      if (!run) return;
      Object.values(run.respostas || {}).forEach(task => {
        taskCount++;
        totalTokens += task.metricas?.tokens?.total_tokens || task.metricas?.tokens?.output_tokens || 0;
        totalMs     += task.metricas?.duration_ms || 0;
        if (task.metricas && 'erro' in task.metricas) errorCount++;
        if (task.avaliacao?.nota_geral != null) { notaSum += task.avaliacao.nota_geral; notaCount++; }
      });
    });
    return { totalTokens, totalMs, avgNota: notaCount ? notaSum/notaCount : null, errorCount, taskCount };
  }

  function fmtTokens(n) {
    if (!n) return '—';
    if (n >= 1_000_000) return (n/1_000_000).toFixed(1) + 'M';
    if (n >= 1_000)     return Math.round(n/1_000) + 'k';
    return String(n);
  }

  function modelKeyToOr(key) {
    // Converte chave local → ID do OpenRouter:
    // openrouter_qwen_qwen3-next_free → qwen/qwen3-next:free (não /free)
    const base = key.replace(/_/g, '/').replace(/^openrouter\//, '');
    return base.replace(/\/free$/, ':free');
  }

  // Custo = input × prompt_price + output × completion_price (sem desconto de cache)
  function computeCost(inputTok, outputTok, prices) {
    if (!prices) return null;
    const c = (inputTok||0) * prices.prompt + (outputTok||0) * prices.completion;
    return c > 0 ? c : null;
  }

  function fmtCost(usd) {
    if (usd == null || usd <= 0) return null;
    if (usd < 0.00001) return '<$0.00001';
    if (usd < 0.001)   return '$' + usd.toFixed(5);
    if (usd < 0.01)    return '$' + usd.toFixed(4);
    if (usd < 1)       return '$' + usd.toFixed(3);
    return '$' + usd.toFixed(2);
  }

  function fmtMmSs(sec) {
    if (!sec && sec !== 0) return '—';
    const m = Math.floor(sec / 60);
    const s = Math.round(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function fmtDuration(ms) {
    if (!ms) return '—';
    const s = Math.round(ms/1000);
    if (s < 60)   return s + 's';
    const m = Math.floor(s/60), rem = s%60;
    if (m < 60)   return m + 'm' + (rem ? rem + 's' : '');
    return Math.floor(m/60) + 'h' + (m%60 ? (m%60) + 'm' : '');
  }

  function computeMaxes(models) {
    const maxTps = {}, maxTok = {};
    models.forEach(m => Object.entries(m.tasks).forEach(([k,v]) => {
      maxTps[k] = Math.max(maxTps[k]||0, v.tps);
      maxTok[k] = Math.max(maxTok[k]||0, v.tokens||0);
    }));
    return { maxTps, maxTok };
  }

  function qsIndex(_tps, _maxTps, notaGeral) {

  }
  function fmtQsi(q)     { return q.toFixed(1); }

  function qsiColor(q)   { return q>=80?'#56d364':q>=60?'#e3b341':'#f85149'; }
  function hexRgb(hex)   { return hex.slice(1).match(/../g).map(h=>parseInt(h,16)); }

  function shortId(ts) { return md5hex(ts).slice(0,4).toUpperCase(); }

  /* ── Artifact Viewers ───────────────────────── */

  function parseJsonl(text) {
    return text.split('\n').filter(l=>l.trim()).map(l=>{try{return JSON.parse(l);}catch{return null;}}).filter(Boolean);
  }

  function fmtStepTime(sec) {
    if (sec == null || sec < 0) return null;
    if (sec < 1)  return sec.toFixed(3) + 's';
    if (sec < 60) return sec.toFixed(1) + 's';
    return Math.floor(sec/60) + 'm ' + (sec%60).toFixed(0) + 's';
  }

  const SessionViewer = ({ url }) => {
    const [entries, setEntries] = React.useState(null);
    const [err, setErr]         = React.useState(null);
    React.useEffect(() => {
      fetch(url + '?' + Date.now())
        .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
        .then(text=>setEntries(parseJsonl(text)))
        .catch(e=>setErr(e.message));
    }, [url]);
    if (err)      return <div style={{color:'#f85149',fontSize:11,fontFamily:'JetBrains Mono,monospace'}}>Erro: {err}</div>;
    if (!entries) return <div style={{color:'var(--text-dim)',fontSize:11,fontStyle:'italic'}}>Carregando…</div>;

    const modelEntry = entries.find(e=>e.type==='model_change');
    const messages   = entries.filter(e=>e.type==='message' && e.message?.role);

    // Mapa toolCallId → toolResult msg para combinar num bloco só
    const resultMap = {};
    messages.forEach(e => {
      const m = e.message;
      if (m.role === 'toolResult' && m.toolCallId) resultMap[m.toolCallId] = m;
    });
    // IDs de toolResults já consumidos inline (não renderizar separado)
    const consumed = new Set();

    const renderToolResult = (res) => {
      if (!res) return null;
      const isErr   = res.isError;
      const content = Array.isArray(res.content) ? res.content : [];
      const text    = content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
      const images  = content.filter(c=>c.type==='image');
      const bdr = isErr ? 'rgba(248,81,73,0.25)' : 'rgba(139,148,158,0.15)';
      return (
        <div style={{borderTop:`1px solid ${bdr}`,padding:'0'}}>
          {images.map((img,ii)=>(
            <img key={ii} src={`data:${img.mediaType};base64,${img.data}`}
              style={{maxWidth:'100%',display:'block'}} alt="screenshot"/>
          ))}
          {text && (
            <div style={{padding:'6px 10px',fontSize:10,
              color:isErr?'#f85149':'var(--text-muted)',lineHeight:1.5,
              maxHeight:140,overflowY:'auto',fontFamily:'JetBrains Mono,monospace',
              whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
              {text.length>700 ? text.slice(0,700)+'…' : text}
            </div>
          )}
        </div>
      );
    };

    return (
      <div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:500,overflowY:'auto',paddingRight:4}}>
        {modelEntry && (
          <div style={{fontSize:9,color:'var(--text-dim)',fontFamily:'JetBrains Mono,monospace',
            marginBottom:6,padding:'2px 8px',background:'var(--badge-bg)',borderRadius:4,
            display:'inline-block',alignSelf:'flex-start'}}>
            {modelEntry.provider} / {modelEntry.modelId}
          </div>
        )}
        {messages.map((entry,i) => {
          const msg  = entry.message;
          const role = msg.role;
          const prevTs = i > 0 ? messages[i-1].timestamp : null;
          const elapsed = (entry.timestamp && prevTs)
            ? (new Date(entry.timestamp) - new Date(prevTs)) / 1000
            : null;
          const elapsedLabel = elapsed != null && elapsed >= 0.05 ? fmtStepTime(elapsed) : null;

          // toolResults renderizados inline com o toolCall — pula aqui
          if (role === 'toolResult') {
            if (consumed.has(msg.toolCallId)) return null;
            // toolResult órfão (sem toolCall anterior) — renderiza standalone
            const isErr   = msg.isError;
            const bdr = isErr ? 'rgba(248,81,73,0.3)' : 'rgba(139,148,158,0.18)';
            const bg  = isErr ? 'rgba(248,81,73,0.05)' : 'transparent';
            const content = Array.isArray(msg.content) ? msg.content : [];
            const text    = content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
            const images  = content.filter(c=>c.type==='image');
            return (
              <div key={i} style={{alignSelf:'flex-start',maxWidth:'95%',marginBottom:2}}>
                <div style={{border:`1px solid ${bdr}`,borderRadius:6,overflow:'hidden',background:bg}}>
                  <div style={{padding:'3px 8px',fontSize:9,fontWeight:700,
                    color:isErr?'#f85149':'#8b949e',fontFamily:'JetBrains Mono,monospace',
                    background:isErr?'rgba(248,81,73,0.08)':'rgba(139,148,158,0.06)'}}>
                    {isErr?'✗':'✓'} {msg.toolName}
                  </div>
                  {images.map((img,ii)=>(
                    <img key={ii} src={`data:${img.mediaType};base64,${img.data}`}
                      style={{maxWidth:'100%',display:'block'}} alt="screenshot"/>
                  ))}
                  {text && (
                    <div style={{padding:'6px 10px',fontSize:10,color:isErr?'#f85149':'var(--text-muted)',
                      lineHeight:1.5,maxHeight:120,overflowY:'auto',fontFamily:'JetBrains Mono,monospace',
                      whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
                      {text.length>600?text.slice(0,600)+'…':text}
                    </div>
                  )}
                </div>
              </div>
            );
          }

          if (role === 'user') {
            const text = Array.isArray(msg.content)
              ? msg.content.filter(c=>c.type==='text').map(c=>c.text).join('\n')
              : (msg.content||'');
            if (!text.trim()) return null;
            return (
              <div key={i} style={{alignSelf:'flex-end',maxWidth:'85%',marginBottom:2}}>
                {elapsedLabel && <div style={{textAlign:'right',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'#56d364',opacity:.7,marginBottom:2}}>+{elapsedLabel}</div>}
                <div style={{background:'rgba(56,139,253,0.1)',border:'1px solid rgba(56,139,253,0.25)',
                  borderRadius:'10px 10px 2px 10px',padding:'7px 12px',fontSize:11,
                  color:'var(--text)',lineHeight:1.5}}>
                  {text}
                </div>
              </div>
            );
          }

          if (role === 'assistant') {
            const content = Array.isArray(msg.content) ? msg.content : [];
            return (
              <div key={i} style={{alignSelf:'flex-start',maxWidth:'95%',marginBottom:2,
                display:'flex',flexDirection:'column',gap:3}}>
                {content.map((c,ci) => {
                  if (c.type==='thinking') return (
                    <details key={ci} style={{border:'1px solid var(--border)',borderRadius:6,overflow:'hidden'}}>
                      <summary style={{padding:'4px 10px',fontSize:10,color:'var(--text-dim)',
                        cursor:'pointer',background:'var(--bg)',userSelect:'none',
                        listStyle:'none',display:'flex',alignItems:'center',gap:6}}>
                        <span>💭</span><span>Thinking</span>
                        {ci===0 && elapsedLabel && <span style={{marginLeft:6,fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'#56d364',opacity:.8}}>+{elapsedLabel}</span>}
                        <span style={{marginLeft:'auto',fontSize:9,opacity:.6}}>▾</span>
                      </summary>
                      <div style={{padding:'8px 10px',fontSize:10,color:'var(--text-dim)',
                        fontStyle:'italic',lineHeight:1.6,background:'var(--bg)',
                        maxHeight:200,overflowY:'auto',whiteSpace:'pre-wrap'}}>
                        {c.thinking}
                      </div>
                    </details>
                  );
                  if (c.type==='toolCall') {
                    // toolCall: campos corretos são c.name e c.arguments
                    const toolName = c.name || c.toolName || '?';
                    const args     = c.arguments || c.input || {};
                    const preview  = JSON.stringify(args).slice(0,120);
                    const result   = resultMap[c.id];
                    if (result) consumed.add(c.id);
                    const isErr    = result?.isError;
                    const bdr      = isErr ? 'rgba(248,81,73,0.25)' : 'rgba(86,211,100,0.2)';
                    return (
                      <div key={ci} style={{border:`1px solid ${bdr}`,borderRadius:6,
                        overflow:'hidden',background:isErr?'rgba(248,81,73,0.04)':'rgba(86,211,100,0.04)'}}>
                        {/* Header: nome + args */}
                        <div style={{padding:'5px 10px',display:'flex',alignItems:'center',gap:6,
                          background:isErr?'rgba(248,81,73,0.07)':'rgba(86,211,100,0.07)',
                          borderBottom:result?`1px solid ${bdr}`:'none'}}>
                          <span style={{fontSize:9,fontWeight:700,
                            color:isErr?'#f85149':'#56d364',
                            fontFamily:'JetBrains Mono,monospace',background:isErr?'rgba(248,81,73,0.12)':'rgba(86,211,100,0.12)',
                            padding:'1px 6px',borderRadius:3,flexShrink:0}}>
                            {isErr?'✗':'✓'} {toolName}
                          </span>
                          <span style={{fontSize:9,color:'var(--text-dim)',overflow:'hidden',
                            textOverflow:'ellipsis',whiteSpace:'nowrap',fontFamily:'JetBrains Mono,monospace',flex:1}}>
                            {preview}
                          </span>
                          {ci===0 && elapsedLabel && <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'#56d364',opacity:.8,flexShrink:0}}>+{elapsedLabel}</span>}
                        </div>
                        {/* Resultado inline */}
                        {result && renderToolResult(result)}
                      </div>
                    );
                  }
                  if (c.type==='text' && c.text?.trim()) return (
                    <div key={ci} style={{background:'var(--bg)',border:'1px solid var(--border)',
                      borderRadius:'2px 10px 10px 10px',padding:'7px 12px',fontSize:11,
                      color:'var(--text)',lineHeight:1.6}}>
                      <MarkdownBlock content={c.text}/>
                    </div>
                  );
                  return null;
                })}
                {msg.usage && (
                  <div style={{fontSize:9,color:'var(--text-dim)',fontFamily:'JetBrains Mono,monospace',
                    alignSelf:'flex-end',marginTop:1}}>
                    ↑{msg.usage.input} ↓{msg.usage.output}
                    {msg.usage.reasoning ? ` 💭${msg.usage.reasoning}` : ''}
                    {msg.usage.cache_read ? ` 💾${msg.usage.cache_read}` : ''}
                  </div>
                )}
              </div>
            );
          }
          return null;
        })}
      </div>
    );
  };

  const TrajectoryViewer = ({ url }) => {
    const [entries, setEntries] = React.useState(null);
    const [err, setErr]         = React.useState(null);
    React.useEffect(() => {
      fetch(url + '?' + Date.now())
        .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
        .then(text=>setEntries(parseJsonl(text)))
        .catch(e=>setErr(e.message));
    }, [url]);
    if (err)      return <div style={{color:'#f85149',fontSize:11,fontFamily:'JetBrains Mono,monospace'}}>Erro: {err}</div>;
    if (!entries) return <div style={{color:'var(--text-dim)',fontSize:11,fontStyle:'italic'}}>Carregando…</div>;

    const completed = entries.filter(e=>e.type==='model.completed');
    const ended     = entries.find(e=>e.type==='session.ended');
    const usage     = completed.reduce((acc,e)=>{
      const u = e.data?.usage||{};
      return {input:acc.input+(u.input||0), output:acc.output+(u.output||0),
              reasoning:acc.reasoning+(u.reasoning||0), cache_read:acc.cache_read+(u.cache_read||0)};
    }, {input:0,output:0,reasoning:0,cache_read:0});
    const status   = ended?.data?.status || '?';
    const termErr  = ended?.data?.terminalError;

    const TYPE_CFG = {
      'session.started':   { color:'#388bfd', label:'Sessão iniciada' },
      'trace.metadata':    { color:'#8b949e', label:'Metadados' },
      'context.compiled':  { color:'#e3b341', label:'Contexto compilado' },
      'prompt.submitted':  { color:'#79c0ff', label:'Prompt enviado' },
      'model.completed':   { color:'#56d364', label:'Modelo respondeu' },
      'trace.artifacts':   { color:'#ff9f7f', label:'Artefatos capturados' },
      'session.ended':     { color: status==='ok'?'#56d364':'#f85149', label:'Sessão encerrada' },
    };

    const fmtTok = n => n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n);

    return (
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {/* Usage chips */}
        {(usage.input + usage.output) > 0 && (
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {[
              {label:'Input',     val:usage.input,      color:'#79c0ff'},
              {label:'Output',    val:usage.output,     color:'#56d364'},
              ...(usage.reasoning  > 0 ? [{label:'Reasoning', val:usage.reasoning,  color:'#e3b341'}] : []),
              ...(usage.cache_read > 0 ? [{label:'Cache',     val:usage.cache_read, color:'#8b949e'}] : []),
              {label:'Status', val:null, color:status==='ok'?'#56d364':'#f85149', text:status},
            ].map(({label,val,color,text})=>(
              <div key={label} style={{background:'var(--bg)',border:`1px solid ${color}22`,
                borderRadius:6,padding:'5px 10px',textAlign:'center',minWidth:60}}>
                <div style={{fontSize:8,color:'var(--text-dim)',textTransform:'uppercase',
                  letterSpacing:'.06em',marginBottom:2}}>{label}</div>
                <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:13,
                  fontWeight:700,color,lineHeight:1}}>{text ?? fmtTok(val)}</div>
              </div>
            ))}
          </div>
        )}
        {termErr && (
          <div style={{fontSize:10,color:'#f85149',fontFamily:'JetBrains Mono,monospace',
            background:'rgba(248,81,73,0.07)',border:'1px solid rgba(248,81,73,0.2)',
            borderRadius:5,padding:'5px 10px'}}>{termErr}</div>
        )}
        {/* Timeline */}
        <div style={{position:'relative',paddingLeft:18}}>
          <div style={{position:'absolute',left:6,top:4,bottom:4,width:1,background:'var(--border)'}}/>
          {entries.map((e,i)=>{
            const cfg   = TYPE_CFG[e.type] || {color:'var(--text-dim)',label:e.type};
            let detail  = null;
            if (e.type==='model.completed' && e.data?.usage) {
              const u = e.data.usage;
              detail = `↑${fmtTok(u.input||0)} ↓${fmtTok(u.output||0)}${u.reasoning?` 💭${fmtTok(u.reasoning)}`:''}`;
            }
            if (e.type==='context.compiled' && e.data?.prompt)
              detail = e.data.prompt.slice(0,90) + (e.data.prompt.length>90?'…':'');
            if (e.type==='session.ended' && termErr) detail = termErr;
            return (
              <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,
                marginBottom:5,position:'relative'}}>
                <div style={{position:'absolute',left:-12,top:5,width:8,height:8,borderRadius:'50%',
                  background:cfg.color,border:'2px solid var(--bg)',flexShrink:0,zIndex:1}}/>
                <div style={{flex:1,marginLeft:4}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,
                      fontWeight:600,color:cfg.color}}>{cfg.label}</span>
                    {e.seq!=null && <span style={{fontSize:9,color:'var(--text-dim)',
                      fontFamily:'JetBrains Mono,monospace'}}>#{e.seq}</span>}
                  </div>
                  {detail && <div style={{fontSize:9,color:'var(--text-dim)',
                    marginTop:1,lineHeight:1.4,fontFamily:'JetBrains Mono,monospace'}}>{detail}</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const LightboxViewer = ({ item, onClose }) => {
    const [mdHtml, setMdHtml] = React.useState(null);

    useEffect(() => {
      const handler = e => { if (e.key==='Escape') onClose(); };
      window.addEventListener('keydown', handler);
      return () => window.removeEventListener('keydown', handler);
    }, [onClose]);

    // carrega e renderiza markdown via marked
    useEffect(() => {
      if (item.tipo !== 'md') return;
      fetch(item.url)
        .then(r => r.text())
        .then(txt => setMdHtml(window.marked ? window.marked.parse(txt) : `<pre>${txt}</pre>`))
        .catch(() => setMdHtml('<p style="color:var(--text-muted)">Erro ao carregar arquivo.</p>'));
    }, [item.url, item.tipo]);

    return (
      <div onClick={onClose}
        style={{position:'fixed',inset:0,zIndex:9999,background:'rgba(0,0,0,0.85)',
          display:'flex',alignItems:'center',justifyContent:'center',cursor:'zoom-out',padding:20}}>
        <div onClick={e=>e.stopPropagation()}
          style={{position:'relative',maxWidth:'92vw',maxHeight:'90vh',width: item.tipo==='png' ? 'auto' : '92vw',
            background:'var(--bg-surface)',borderRadius:10,overflow:'hidden',
            boxShadow:'0 8px 40px rgba(0,0,0,0.7)',display:'flex',flexDirection:'column',cursor:'default'}}>
          <div style={{position:'absolute',top:8,right:8,zIndex:1,display:'flex',gap:6}}>
            {item.tipo==='html' && (
              <a href={item.url} target="_blank" rel="noreferrer"
                style={{background:'rgba(0,0,0,0.5)',border:'none',borderRadius:6,color:'#fff',cursor:'pointer',
                  width:28,height:28,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center',
                  textDecoration:'none'}}
                title="Abrir em nova aba">
                ↗
              </a>
            )}
            <button onClick={onClose}
              style={{background:'rgba(0,0,0,0.5)',border:'none',borderRadius:6,color:'#fff',cursor:'pointer',
                width:28,height:28,fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>
              ✕
            </button>
          </div>
          {item.tipo==='png' && (
            <img src={item.url} alt={item.nome}
              style={{maxWidth:'88vw',maxHeight:'86vh',objectFit:'contain',display:'block'}}/>
          )}
          {item.tipo==='html' && (
            <iframe src={item.url} title={item.nome}
              style={{width:'88vw',height:'82vh',border:'none',display:'block'}}/>
          )}
          {item.tipo==='md' && (
            <div style={{overflowY:'auto',maxHeight:'86vh',padding:'24px 28px',
              fontFamily:'Inter,system-ui,sans-serif',fontSize:13,lineHeight:1.7,color:'var(--text)',
              minWidth:400, width:'min(72ch, 88vw)'}}>
              <div style={{fontSize:11,color:'var(--text-dim)',fontFamily:'JetBrains Mono,monospace',marginBottom:16}}>
                {item.nome}
              </div>
              {mdHtml
                ? <div className="md-body" dangerouslySetInnerHTML={{__html: mdHtml}}/>
                : <span style={{color:'var(--text-dim)'}}>Carregando…</span>
              }
            </div>
          )}
        </div>
      </div>
    );
  };

  const ArtifatosViewer = ({ artefatos }) => {
    const [expanded, setExpanded] = React.useState({});
    const [lightbox, setLightbox] = React.useState(null); // { url, tipo }
    const toggle = k => setExpanded(p=>({...p,[k]:!p[k]}));

    const ICONS = {png:'🖼',html:'📄',json:'{}',txt:'📝',cjs:'⚙',mjs:'⚙',md:'📝'};
    // exclui trajectory-path (arquivo de rota interna, sem valor visual)
    const regular     = artefatos.filter(a=>a.tipo!=='jsonl' && !a.nome.includes('trajectory-path') && !a.nome.includes('trajectory_path'));
    const sessions    = artefatos.filter(a=>a.tipo==='jsonl' && a.nome.includes('session') && !a.nome.includes('trajectory'));
    const trajectories= artefatos.filter(a=>a.tipo==='jsonl' && a.nome.includes('trajectory') && !a.nome.includes('path'));

    return (
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {/* lightbox para PNG, HTML e MD */}
        {lightbox && (
          <LightboxViewer item={lightbox} onClose={()=>setLightbox(null)}/>
        )}
        {regular.length > 0 && (
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {regular.map((a,i)=>{
              const icon = ICONS[a.tipo]||'📎';
              const kb = (a.tamanho_bytes/1024).toFixed(1);
              const isLightboxable = a.tipo==='png' || a.tipo==='html' || a.tipo==='md';
              // png e html abrem em lightbox; demais abrem em nova aba
              if (isLightboxable) return (
                <button key={i} onClick={()=>setLightbox({url:a.caminho_relativo,tipo:a.tipo,nome:a.nome})}
                  style={{display:'inline-flex',alignItems:'center',gap:5,
                    padding:'5px 10px',borderRadius:6,border:'1px solid var(--border)',
                    background:'var(--bg)',color:'var(--text)',cursor:'pointer',
                    fontSize:11,fontFamily:'JetBrains Mono,monospace',transition:'border-color 0.1s'}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border-sep)'}
                  onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                  <span style={{fontSize:14}}>{icon}</span>
                  <span>{a.nome}</span>
                  <span style={{color:'var(--text-dim)',fontSize:9}}>{kb}KB</span>
                </button>
              );
              return (
                <a key={i} href={a.caminho_relativo} target="_blank" rel="noreferrer"
                  style={{display:'inline-flex',alignItems:'center',gap:5,
                    padding:'5px 10px',borderRadius:6,border:'1px solid var(--border)',
                    background:'var(--bg)',color:'var(--text)',textDecoration:'none',
                    fontSize:11,fontFamily:'JetBrains Mono,monospace',transition:'border-color 0.1s'}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border-sep)'}
                  onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                  <span style={{fontSize:14}}>{icon}</span>
                  <span>{a.nome}</span>
                  <span style={{color:'var(--text-dim)',fontSize:9}}>{kb}KB</span>
                </a>
              );
            })}
          </div>
        )}
        {sessions.map((a,i)=>{
          const k = 'sess-'+i;
          const kb = (a.tamanho_bytes/1024).toFixed(1);
          return (
            <div key={k} style={{border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
              <button onClick={()=>toggle(k)} style={{width:'100%',padding:'8px 12px',background:'var(--bg)',
                border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:8,
                color:'var(--text)',fontFamily:'inherit',fontSize:11,transition:'background 0.1s'}}
                onMouseEnter={e=>e.currentTarget.style.background='var(--bg-hover)'}
                onMouseLeave={e=>e.currentTarget.style.background='var(--bg)'}>
                <span>💬</span>
                <span style={{fontWeight:600}}>Transcrição</span>
                <span style={{fontSize:9,color:'var(--text-dim)',fontFamily:'JetBrains Mono,monospace'}}>{a.nome} · {kb}KB</span>
                <span style={{marginLeft:'auto',fontSize:9,color:'var(--text-dim)'}}>{expanded[k]?'▴':'▾'}</span>
              </button>
              {expanded[k] && (
                <div style={{borderTop:'1px solid var(--border)',padding:'10px 12px',background:'var(--bg-hover)'}}>
                  <SessionViewer url={a.caminho_relativo}/>
                </div>
              )}
            </div>
          );
        })}
        {trajectories.map((a,i)=>{
          const k = 'traj-'+i;
          const kb = (a.tamanho_bytes/1024).toFixed(1);
          return (
            <div key={k} style={{border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
              <button onClick={()=>toggle(k)} style={{width:'100%',padding:'8px 12px',background:'var(--bg)',
                border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:8,
                color:'var(--text)',fontFamily:'inherit',fontSize:11,transition:'background 0.1s'}}
                onMouseEnter={e=>e.currentTarget.style.background='var(--bg-hover)'}
                onMouseLeave={e=>e.currentTarget.style.background='var(--bg)'}>
                <span>📊</span>
                <span style={{fontWeight:600}}>Trace de Execução</span>
                <span style={{fontSize:9,color:'var(--text-dim)',fontFamily:'JetBrains Mono,monospace'}}>{a.nome} · {kb}KB</span>
                <span style={{marginLeft:'auto',fontSize:9,color:'var(--text-dim)'}}>{expanded[k]?'▴':'▾'}</span>
              </button>
              {expanded[k] && (
                <div style={{borderTop:'1px solid var(--border)',padding:'10px 12px',background:'var(--bg-hover)'}}>
                  <TrajectoryViewer url={a.caminho_relativo}/>
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  };

  /* ── Modal ───────────────────────────────────── */
  const Modal = ({ data, models, visibleMetrics, modelPrices, onClose, onNavigate }) => {
    if (!data) return null;
    const { type, modelIdx, groupKey, taskKey } = data;
    const model = models[modelIdx];
    const group = GROUPS.find(g=>g.key===groupKey);

    // lista plana de todas as tasks para navegação ←/→
    const allTasks = GROUPS.flatMap(g => g.tasks.map(tk => ({groupKey: g.key, taskKey: tk})));
    const curTaskIdx = taskKey ? allTasks.findIndex(t => t.groupKey===groupKey && t.taskKey===taskKey) : -1;
    const canLeft  = curTaskIdx > 0;
    const canRight = curTaskIdx < allTasks.length - 1;
    const canUp    = modelIdx > 0;
    const canDown  = modelIdx < models.length - 1;

    useEffect(() => {
      const handler = e => {
        if (e.key==='Escape') { onClose(); return; }
        // ignora setas dentro de inputs/textareas para não interferir com scroll
        if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
        if (e.key==='ArrowLeft'  && canLeft)  { e.preventDefault(); const t=allTasks[curTaskIdx-1]; onNavigate({...data,groupKey:t.groupKey,taskKey:t.taskKey}); }
        if (e.key==='ArrowRight' && canRight) { e.preventDefault(); const t=allTasks[curTaskIdx+1]; onNavigate({...data,groupKey:t.groupKey,taskKey:t.taskKey}); }
        if (e.key==='ArrowUp'    && canUp)    { e.preventDefault(); onNavigate({...data,modelIdx:modelIdx-1}); }
        if (e.key==='ArrowDown'  && canDown)  { e.preventDefault(); onNavigate({...data,modelIdx:modelIdx+1}); }
      };
      window.addEventListener('keydown', handler);
      return () => window.removeEventListener('keydown', handler);
    }, [data, canLeft, canRight, canUp, canDown]);

    // Render a single task's full details
    const TaskDetail = ({ task }) => {
      if (!task) return <div style={{color:'var(--text-muted)',fontSize:12}}>Sem dados para esta tarefa.</div>;
      const av = task.avaliacao;
      const nc = task.notaGeral!=null ? notaColor(task.notaGeral) : 'var(--text-dim)';
      const mpr = modelPrices[modelKeyToOr(model.key)];
      const taskCost = computeCost(task.inputTok, task.outputTok, mpr);
      const costStr  = fmtCost(taskCost);

      return (
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          {/* Scores row: Nota · Tokens · Tempo · Custo */}
          <div style={{display:'flex',gap:10}}>
            {[
              { label:'Nota',   val:task.notaGeral!=null?task.notaGeral.toFixed(1):'—', color:nc,                  sub:'/10'     },
              { label:'Tokens', val:task.tokens>0?Math.round(task.tokens).toLocaleString('pt-BR'):'—', color:'var(--text-muted)', sub:'output' },
              { label:'Tempo',  val:task.tps>0?fmtMmSs(task.tps):'—',                  color:'var(--text)',        sub:'duração' },
              { label:'Custo',  val:costStr||'—',                                       color:'#e3b341',            sub:'USD'     },
            ].map(({label,val,color,sub}) => (
              <div key={label} style={{flex:1,background:'var(--bg)',border:'1px solid var(--border)',
                borderRadius:8,padding:'10px 12px',textAlign:'center'}}>
                <div style={{fontSize:9,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text-dim)',marginBottom:4}}>{label}</div>
                <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:20,fontWeight:700,color,lineHeight:1}}>{val}</div>
                <div style={{fontSize:9,color:'var(--text-dim)',marginTop:2}}>{sub}</div>
              </div>
            ))}
          </div>

          {/* Resumo */}
          {av?.resumo && (
            <div>
              <div className="modal-section-label">Resumo</div>
              <div className="modal-resumo">{av.resumo}</div>
            </div>
          )}

          {/* Resposta e prompts */}
          {(() => {
            const accordionItems = [
              ...(task.resposta ? [{ title:'Resposta do Modelo', accent:'#56d364', content:<MarkdownBlock content={task.resposta}/> }] : []),
              ...(task.prompt ? [{ title:'Prompt da Pergunta', accent:'#79c0ff', content:<MarkdownBlock content={task.prompt}/> }] : []),
              ...(task.prompt_analise ? [{ title:'Prompt de Avaliação', accent:'#e3b341', content:<MarkdownBlock content={task.prompt_analise}/> }] : []),
            ];
            if (!accordionItems.length) return null;
            return (
              <div>
                <div className="modal-section-label">Resposta & Prompts</div>
                <Accordion items={accordionItems} defaultOpen={window.innerWidth > 640 ? 0 : null}/>
              </div>
            );
          })()}

          {/* Criterios */}
          {av?.criterios && (
            <div>
              <div className="modal-section-label">Critérios de Avaliação</div>
              <div style={{border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
                {Object.entries(av.criterios).map(([ck,cv],i) => (
                  <div key={ck} className="criterio-row" style={{padding:'10px 14px',background:i%2===0?'transparent':'rgba(0,0,0,0.02)'}}>
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:5}}>
                      <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,fontWeight:700,
                        color:notaColor(cv.nota||0),minWidth:28,textAlign:'right'}}>{cv.nota!=null?cv.nota:'—'}</span>
                      <div style={{flex:1,height:4,background:'var(--bar-track)',borderRadius:2,overflow:'hidden'}}>
                        <div style={{width:`${((cv.nota||0)/10)*100}%`,height:'100%',background:notaColor(cv.nota||0),borderRadius:2}}/>
                      </div>
                      <span style={{fontSize:9,color:'var(--text-dim)',minWidth:28}}>/10</span>
                      <span style={{fontSize:11,fontWeight:600,color:'var(--text)',flex:2}}>{fmtKey(ck)}</span>
                    </div>
                    <p style={{fontSize:11,color:'var(--text-muted)',lineHeight:1.6,marginLeft:38,marginRight:8}}>
                      {cv.justificativa}
                    </p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Artefatos */}
          {task.artefatos?.length > 0 && (
            <div>
              <div className="modal-section-label">Artefatos</div>
              <ArtifatosViewer artefatos={task.artefatos}/>
            </div>
          )}

          {/* Erro */}
          {task.hasError && (
            <div>
              <div className="modal-section-label">Erro</div>
              <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,color:'#f85149',
                background:'rgba(248,81,73,0.08)',border:'1px solid rgba(248,81,73,0.2)',
                borderRadius:6,padding:'10px 12px',wordBreak:'break-all'}}>
                {task.erroMsg}
              </div>
            </div>
          )}
        </div>
      );
    };

    // Group modal: list all tasks
    const GroupModal = () => (
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {group.tasks.map(tk => {
          const task = model.tasks[tk];
          if (!task) return null;
          const av   = task.avaliacao;
          const nc   = task.notaGeral!=null ? notaColor(task.notaGeral) : 'var(--text-dim)';
          const mpr  = modelPrices[modelKeyToOr(model.key)];
          const cs   = fmtCost(computeCost(task.inputTok, task.outputTok, mpr));
          return (
            <div key={tk} style={{border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
              <div style={{padding:'10px 14px',background:group.bg,
                display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                <span style={{fontWeight:600,fontSize:12,color:'var(--text)'}}>{task.nome}</span>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  {task.notaGeral!=null && <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,fontWeight:700,color:nc}}>{task.notaGeral.toFixed(1)}/10</span>}
                  {task.tokens>0 && <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,color:'var(--text-dim)'}}>{task.tokens.toLocaleString('pt-BR')} tok</span>}
                  {task.tps>0 && <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,color:'var(--text-dim)'}}>{fmtMmSs(task.tps)}</span>}
                  {cs && <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,fontWeight:600,color:'#e3b341'}}>{cs}</span>}
                </div>
              </div>
              {av?.resumo && (
                <div style={{padding:'10px 14px',fontSize:11,color:'var(--text-muted)',lineHeight:1.6,background:'var(--bg-surface)'}}>
                  {av.resumo}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );

    const title = type==='task' ? (model.tasks[taskKey]?.nome || taskKey) : `${group.label} — visão geral`;
    const accentColor = group?.color || 'var(--text-muted)';

    return (
      <div className="modal-overlay" onMouseDown={e => { if (e.target===e.currentTarget) onClose(); }}>
        <div className="modal-card" style={{maxWidth:760}}>
          {/* Header */}
          <div className="modal-header">
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
              <div>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                  <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,fontWeight:600,
                    padding:'2px 8px',borderRadius:20,border:`1px solid ${accentColor}`,color:accentColor}}>
                    {group?.icon} {group?.label}
                  </span>
                  <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,color:'var(--text-dim)',
                    background:'var(--badge-bg)',padding:'2px 8px',borderRadius:20}}>
                    {model.name}
                  </span>
                </div>
                <h2 style={{fontSize:15,fontWeight:700,color:'var(--text)',letterSpacing:'-0.3px',lineHeight:1.3}}>
                  {title}
                </h2>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
                {/* nav ↑↓ modelo */}
                <div style={{display:'flex',flexDirection:'column',gap:2}}>
                  {[['▲',canUp,()=>onNavigate({...data,modelIdx:modelIdx-1})],
                    ['▼',canDown,()=>onNavigate({...data,modelIdx:modelIdx+1})]].map(([lbl,enabled,fn])=>(
                    <button key={lbl} onClick={enabled?fn:undefined}
                      title={lbl==='▲'?'Modelo anterior (↑)':'Próximo modelo (↓)'}
                      style={{background:'none',border:'1px solid var(--border)',borderRadius:4,
                        width:22,height:12,cursor:enabled?'pointer':'default',
                        color:enabled?'var(--text-muted)':'var(--border)',
                        fontSize:7,display:'flex',alignItems:'center',justifyContent:'center',
                        opacity:enabled?1:0.3,transition:'all 0.1s'}}>
                      {lbl}
                    </button>
                  ))}
                </div>
                {/* nav ←→ task */}
                <div style={{display:'flex',gap:2}}>
                  {[['◀',canLeft,()=>{const t=allTasks[curTaskIdx-1];onNavigate({...data,groupKey:t.groupKey,taskKey:t.taskKey});}],
                    ['▶',canRight,()=>{const t=allTasks[curTaskIdx+1];onNavigate({...data,groupKey:t.groupKey,taskKey:t.taskKey});}]].map(([lbl,enabled,fn])=>(
                    <button key={lbl} onClick={enabled?fn:undefined}
                      title={lbl==='◀'?'Task anterior (←)':'Próxima task (→)'}
                      style={{background:'none',border:'1px solid var(--border)',borderRadius:4,

                        opacity:enabled?1:0.3,transition:'all 0.1s'}}>

                  fontSize:14,display:'flex',alignItems:'center',justifyContent:'center',
                  transition:'all 0.1s'
                }}>✕</button>
              </div>
            </div>

          {/* Body */}

              ? <TaskDetail task={model.tasks[taskKey]}/>

        </div>

    );

  /* ── Run Selector (dropdown) ────────────────── */

                      {rs.errorCount > 0 && (

                          · {rs.errorCount} erro{rs.errorCount>1?'s':''}

                  )}

  };

  /* ── Model Selector (dropdown) ─────────────── */
  const ModelSelector = ({ allModels, sel, onChange }) => {
    // sel: null = all selected, Set<key> = partial selection
    const [open, setOpen] = React.useState(false);
    const [hov, setHov]   = React.useState(null);
    const ref = React.useRef(null);

    useEffect(() => {
      const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
      document.addEventListener('mousedown', handler);
      return () => document.removeEventListener('mousedown', handler);
    }, []);

    const allSel     = !sel || sel.size >= allModels.length;
    const isSelected = key => !sel || sel.has(key);

    const label = allSel ? `Todos (${allModels.length})`
                : sel.size === 1 ? (allModels.find(m=>m.key===[...sel][0])?.name ?? [...sel][0])
                : `${sel.size} modelos`;

    const toggle = key => {
      if (allSel) {
        const next = new Set(allModels.map(m=>m.key));
        next.delete(key);
        onChange(next);
      } else {
        const next = new Set(sel);
        if (next.has(key)) { if (next.size > 1) next.delete(key); }
        else { next.add(key); if (next.size >= allModels.length) { onChange(null); return; } }
        onChange(next);
      }

    return (
      <div ref={ref} style={{position:'relative'}}>
        <button onClick={()=>setOpen(o=>!o)} style={{
          display:'inline-flex',alignItems:'center',gap:7,

          border:'1px solid var(--border)',background:'var(--bg-surface)',
          color:'var(--text-muted)',fontFamily:'JetBrains Mono,monospace',fontSize:11,
          transition:'all 0.15s',

          <span style={{width:7,height:7,borderRadius:'50%',flexShrink:0,
            background:allSel?'#56d364':'#f0883e',display:'inline-block'}}/>
          {label}
          <span style={{fontSize:9,opacity:.6,marginLeft:2}}>{open?'▴':'▾'}</span>

        {open && (
          <div style={{

            overflow:'hidden',
            animation:'fadeIn 0.12s ease',

            {/* Todos row */}
            <div
              onClick={()=>onChange(allSel?new Set([allModels[0].key]):null)}
              style={{display:'flex',alignItems:'center',gap:9,padding:'9px 13px',
                cursor:'pointer',borderBottom:'1px solid var(--border)',
                background:allSel?'rgba(56,139,253,0.07)':'transparent',
                transition:'background 0.1s'}}
              onMouseEnter={e=>e.currentTarget.style.background=allSel?'rgba(56,139,253,0.1)':'var(--bg-hover)'}
              onMouseLeave={e=>e.currentTarget.style.background=allSel?'rgba(56,139,253,0.07)':'transparent'}
            >
              <span style={{width:14,height:14,borderRadius:3,flexShrink:0,
                border:`1.5px solid ${allSel?'#388bfd':'var(--border-sep)'}`,
                background:allSel?'#388bfd':'transparent',
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'#fff'}}>

              </span>
              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,fontWeight:600,
                color:allSel?'#79c0ff':'var(--text)'}}>Todos</span>
              <span style={{marginLeft:'auto',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>

                        border:`1.5px solid ${checked?'#388bfd':'var(--border-sep)'}`,
                        background:checked?'#388bfd':'transparent',
                        display:'flex',alignItems:'center',justifyContent:'center',
                        fontSize:9,color:'#fff',cursor:'pointer'}}>
                      {checked?'✓':''}
                    </span>
                    <span
                      onClick={()=>toggle(m.key)}
                      style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,
                        color:checked?'var(--text)':'var(--text-muted)',flex:1,
                        whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                      {m.name}
                    </span>
                    <button
                      onClick={e=>{ e.stopPropagation(); onChange(new Set([m.key])); }}
                      style={{
                        fontFamily:'JetBrains Mono,monospace',fontSize:9,fontWeight:600,
                        padding:'2px 7px',borderRadius:4,cursor:'pointer',
                        border:'1px solid var(--border-sep)',
                        background:'var(--bg)',color:'var(--text-muted)',

          </div>
        )}
      </div>

  };

  /* ── App ─────────────────────────────────────── */
  const App = () => {
    const [raw,setRaw]           = useState(null);
    const [loading,setLoading]   = useState(true);
    const [refreshing,setRefreshing] = useState(false);
    const [err,setErr]           = useState(null);
    const [refreshKey,setRefreshKey] = useState(0);
    const [expanded,setExpanded] = useState(() => {
      try { const s=localStorage.getItem('bm-expanded'); return s?JSON.parse(s):{}; } catch { return {}; }
    });
    const [selRuns,setSelRuns]     = useState(null);
    const [compareRunTs,setCompareRunTs] = useState(null);
    const [selModels,setSelModels] = useState(null);
    const [hovRow,setHovRow]       = useState(null);
    const [modal,setModal]         = useState(null);
    const [modelPrices,setModelPrices] = useState({});
    const [visibleMetrics,setVisibleMetrics] = useState(() => {
      try {
        const saved = localStorage.getItem('bm-metrics');
        if (saved) return JSON.parse(saved);
      } catch {}
      return { qsi: true, cost: true };
    });

    const isInitialRef  = React.useRef(true);
    const knownRunsRef  = React.useRef(new Set());
    const prevSelRunsRef = React.useRef(null);

    useEffect(() => {
      try { localStorage.setItem('bm-metrics', JSON.stringify(visibleMetrics)); } catch {}
    }, [visibleMetrics]);

    useEffect(() => {
      try { localStorage.setItem('bm-expanded', JSON.stringify(expanded)); } catch {}
    }, [expanded]);

    // Reseta filtro de modelos quando o usuário troca de run (não na inicialização)
    useEffect(() => {
      if (!selRuns) return;
      const prev = prevSelRunsRef.current;
      prevSelRunsRef.current = selRuns;
      if (prev === null) return; // primeira atribuição — não reseta
      setSelModels(null);
    }, [selRuns]);


    useEffect(() => {
      const isInitial = isInitialRef.current;
      if (isInitial) setLoading(true); else setRefreshing(true);
      setErr(null);
      fetch(BENCHMARK_FILE + '?' + Date.now())
        .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(data => {
          // Atualiza GROUPS e TASK_NAMES a partir do meta embutido no JSON
          const built = buildGroups(data);
          if (built.length) {
            GROUPS = built;
            TASK_NAMES = Object.fromEntries(GROUPS.flatMap(g => Object.entries(g.taskNames||{})));
          }
          setRaw(data);
          const all = new Set();
          Object.values(data.modelos).forEach(m=>m.runs.forEach(r=>all.add(r.timestamp)));
          const prevKnown  = knownRunsRef.current;
          isInitialRef.current  = false;
          knownRunsRef.current  = all;
          const latestTs = [...all].sort().at(-1);
          setSelRuns(prev => {
            if (isInitial || !prev) return new Set([latestTs]);
            // mantém seleção atual; se chegou nova run, adiciona ela
            const next = new Set([...prev].filter(ts => all.has(ts)));
            all.forEach(ts => { if (!prevKnown.has(ts)) next.add(ts); });
            return next.size > 0 ? next : new Set([latestTs]);
          });
          setCompareRunTs(prev => (prev && all.has(prev) ? prev : null));
          setLoading(false); setRefreshing(false);
        })
        .catch(e=>{ setErr(e.message); setLoading(false); setRefreshing(false); });
    }, [refreshKey]);

    useEffect(() => {
      fetch('model_prices.json?' + Date.now())
        .then(r => r.ok ? r.json() : {})
        .then(setModelPrices)
        .catch(() => {});
    }, []);

    const allRuns = useMemo(() => {
      if (!raw) return [];
      const s=new Set();
      Object.values(raw.modelos).forEach(m=>m.runs.forEach(r=>s.add(r.timestamp)));
      return [...s].sort();
    }, [raw]);

    const runStatsMap = useMemo(() => {
      if (!raw) return {};
      const m={};
      allRuns.forEach(ts => { m[ts] = computeRunStats(raw, ts); });
      return m;
    }, [raw, allRuns]);

    const models = useMemo(() => {
      if (!raw||!selRuns?.size) return [];
      return computeStats(raw.modelos, selRuns);
    }, [raw, selRuns]);

    const allModelItems = useMemo(() => models.map(m => ({ key: m.key, name: m.name })), [models]);

    const filteredModels = useMemo(() => {
      if (!selModels) return models;
      return models.filter(m => selModels.has(m.key));
    }, [models, selModels]);

    const compareModelsByKey = useMemo(() => {
      if (!raw || !compareRunTs) return {};
      const compareModels = computeStats(raw.modelos, new Set([compareRunTs]));
      return compareModels.reduce((acc, m) => {
        acc[m.key] = m;
        return acc;
      }, {});
    }, [raw, compareRunTs]);

    const fmtDelta = (curr, cmp, digits = 1) => {
      if (curr == null || cmp == null) return null;
      const d = curr - cmp;
      const sign = d > 0 ? '+' : '';
      return `${sign}${d.toFixed(digits)}`;
    };

    const { maxTps, maxTok } = useMemo(() => computeMaxes(filteredModels), [filteredModels]);

    const groupBest = useMemo(() => {
      const r={};
      GROUPS.forEach(g=>{
        let best=null,bestVal=-1;
        filteredModels.forEach((m,i)=>{
          const ts=g.tasks.filter(t=>m.tasks[t]);
          if(!ts.length) return;
          const avg=ts.reduce((s,t)=>s+qsIndex(m.tasks[t].tps,null,m.tasks[t].notaGeral),0)/ts.length;
          if(avg>bestVal){bestVal=avg;best=i;}
        });
        r[g.key]=best;
      });
      return r;
    }, [filteredModels,maxTps]);

    const taskBest = useMemo(() => {
      const r={};
      GROUPS.forEach(g=>g.tasks.forEach(tk=>{
        let best=null,bestVal=-1;
        filteredModels.forEach((m,i)=>{
          if(!m.tasks[tk]) return;
          const q=qsIndex(m.tasks[tk].tps,null,m.tasks[tk].notaGeral);
          if(q>bestVal){bestVal=q;best=i;}
        });
        r[tk]=best;
      }));
      return r;
    }, [filteredModels,maxTps]);

    const taskNames = useMemo(() => {
      const r={};
      filteredModels.forEach(m=>Object.entries(m.tasks).forEach(([k,v])=>{r[k]=v.nome;}));
      return r;
    }, [filteredModels]);

    const overallStats = useMemo(() => {
      // Tarefas de diagnóstico não entram no score geral
      const diagKeys = new Set(GROUPS.find(g=>g.diag)?.tasks||[]);
      let bestIdx=null, bestVal=-1;
      const stats = filteredModels.map((m,i) => {
        const tasks=Object.entries(m.tasks).filter(([k])=>!diagKeys.has(k)).map(([,v])=>v);
        if (!tasks.length) return null;
        const avgTps   = tasks.reduce((s,t)=>s+t.tps,0)/tasks.length;
        const totalSec = tasks.reduce((s,t)=>s+t.tps,0);
        const notaTs   = tasks.filter(t=>t.notaGeral!=null);
        const avgNota  = notaTs.length ? notaTs.reduce((s,t)=>s+t.notaGeral,0)/notaTs.length : null;
        const avgQsi   = tasks.reduce((s,t)=>s+qsIndex(t.tps,null,t.notaGeral),0)/tasks.length;
        const sumTok   = tasks.reduce((s,t)=>s+(t.tokens||0),0);
        const tks      = totalSec > 0 ? sumTok / totalSec : 0;
        if (avgQsi>bestVal){bestVal=avgQsi;bestIdx=i;}
        return {avgTps,avgNota,avgQsi,sumTok,tks,sumTps:totalSec};
      });
      const maxAvgTps=Math.max(...stats.filter(Boolean).map(s=>s.avgTps),0);
      const maxSumTok=Math.max(...stats.filter(Boolean).map(s=>s.sumTok),0);
      const maxSumTps=Math.max(...stats.filter(Boolean).map(s=>s.sumTps),0);
      return {stats,bestIdx,maxAvgTps,maxSumTok,maxSumTps};
    }, [filteredModels]);

    const toggle = k => setExpanded(p=>({...p,[k]:!p[k]}));
    const openModal = useCallback((type,modelIdx,groupKey,taskKey=null) => {
      setModal({type,modelIdx,groupKey,taskKey});
    },[]);

    // Tarefas que têm dado em pelo menos um modelo na run atual
    const activeTasks = useMemo(() => {
      const s = new Set();
      models.forEach(m => Object.keys(m.tasks||{}).forEach(tk => s.add(tk)));
      return s;
    }, [models]);

    // Derivado do raw para garantir re-render quando meta mudar (GROUPS module-level não é reativo)
    const activeGroups = useMemo(() => raw ? buildGroups(raw) : [], [raw]);

    const cols = activeGroups.flatMap(g =>
      expanded[g.key] && g.tasks.length > 0

        {/* Título */}

                  allRuns={allRuns}
                  runStatsMap={runStatsMap}
                  sel={selRuns}
                  onChange={setSelRuns}
                  compareTs={compareRunTs}
                  onCompareChange={setCompareRunTs}

                onClick={()=>setRefreshKey(k=>k+1)}

            <span style={{width:1,height:12,background:'var(--border)',display:'inline-block'}}/>
            <span><span style={{color:'#56d364'}}>●</span> ≥8</span>
            <span><span style={{color:'#e3b341'}}>●</span> 6–8</span>
            <span><span style={{color:'#f85149'}}>●</span> &lt;6</span>

                    border:`1.5px solid ${visibleMetrics[m.key]?'#388bfd':'var(--border-sep)'}`,

                    {visibleMetrics[m.key]?'✓':''}

                  <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,
                    color:visibleMetrics[m.key]?'var(--text)':'var(--text-muted)'}}>{m.label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
        </div>

        {/* Group pills + legenda */}
        <div className="group-pills" style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>

              <button key={g.key} onClick={()=>toggle(g.key)} style={{
                background:exp?`rgba(${r},${gg},${b},0.1)`:'transparent',
                border:`1px solid ${exp?g.color:'var(--border)'}`,
                borderRadius:6,padding:'4px 10px',cursor:'pointer',
                color:exp?g.color:'var(--text-muted)',
                fontSize:11,fontWeight:500,display:'flex',alignItems:'center',gap:5,transition:'all 0.15s',

                <span style={{width:7,height:7,borderRadius:1,background:exp?g.color:'var(--border-sep)',display:'inline-block',flexShrink:0}}/>

              </button>

          <div className="legend-row" style={{marginLeft:'auto',display:'flex',gap:10,fontSize:10,color:'var(--text-muted)',alignItems:'center'}}>
            <span><span style={{color:'#56d364',fontWeight:700}}>▲</span> Melhor</span>
            <span style={{width:1,height:12,background:'var(--border)',display:'inline-block'}}/>
            <span><span style={{color:'#56d364'}}>●</span> ≥8</span>
            <span><span style={{color:'#e3b341'}}>●</span> 6–8</span>
            <span><span style={{color:'#f85149'}}>●</span> &lt;6</span>

              {[
                { key:'qsi', label:'Nota' },
                { key:'nota', label:'Tokens' },
                { key:'tps', label:'Tempo' },
                { key:'cost', label:'Custo' },
              ].map(m => (
                <div key={m.key} style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',userSelect:'none'}}

                    {visibleMetrics[m.key]?'✓':''}

                  <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,
                    color:visibleMetrics[m.key]?'var(--text)':'var(--text-muted)'}}>{m.label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Table */}
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th rowSpan={2} className="sticky s1 sep-right"
                  style={{background:'var(--bg)',padding:'11px 16px',textAlign:'left',
                    fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.06em',
                    borderBottom:'1px solid var(--border)'}}>Modelo</th>
                <th rowSpan={2} className="sticky s3 sep-right"

                    borderBottom:'1px solid var(--border)'}}>Provider</th>

                <th rowSpan={2}

                    fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.06em',
                    borderBottom:'2px solid var(--border)',borderRight:'2px solid var(--border-sep)',
