                  return (
                    <th key={g.key} colSpan={exp&&hasData?g.tasks.length:1}
                      onClick={hasData?()=>toggle(g.key):undefined}
                      style={{padding:exp&&hasData?'10px 14px':'8px 6px',background:g.bg,
                        borderBottom:'1px solid var(--border)',borderRight:'2px solid var(--border-sep)',
                        cursor:hasData?'pointer':'default',userSelect:'none',textAlign:'center',
                        color:hasData?g.color:'var(--text-dim)',fontSize:12,fontWeight:700,letterSpacing:'.03em',
                        maxWidth:exp&&hasData?'none':(g.diag?56:130),overflow:'hidden',opacity:hasData?1:0.45}}>
                      <span className="group-btn" style={{justifyContent:'center'}}>
                        {g.icon}
                        {(!g.diag || exp) && <>&nbsp;{g.label}</>}
                        {hasData && <span style={{
                          display:'inline-flex',alignItems:'center',justifyContent:'center',
                          width:16,height:16,borderRadius:4,flexShrink:0,
                          border:`1.5px solid ${g.color}`,
                          color:g.color,fontSize:11,fontWeight:700,lineHeight:1,
                          marginLeft:2,
                        }}>
                          {exp?'−':'+'}
                        </span>}
                      </span>
                    </th>
                  );
                })}
              </tr>
              <tr>
                {cols.map(col=>{
                  const borderR=col.type==='group'||col.last?'2px solid var(--border-sep)':'1px solid var(--border-subtle)';
                  if (col.type==='group') {
                    const runCount = col.g.tasks.filter(tk => activeTasks.has(tk)).length;
                    return (
                    <th key={col.g.key}
                      style={{padding:'7px 14px',background:col.g.bg,
                        borderRight:borderR,borderBottom:'2px solid var(--border)',
                        textAlign:'center',fontSize:10,color:'var(--text-dim)',
                        fontStyle:'italic',fontWeight:400,minWidth:col.g.diag?56:130}}>
                      {col.g.diag
                        ? `${runCount}/${col.g.tasks.length} checks`
                        : runCount > 0 ? `${runCount}/${col.g.tasks.length} tarefas · média` : `sem dados`}
                    </th>
                    );
                  }
                  return (
                    <th key={`${col.g.key}-${col.tk}`} className="col-fade"
                      style={{padding:'7px 10px',background:col.g.bg,
                        borderRight:borderR,borderBottom:'2px solid var(--border)',
                        textAlign:'center',fontSize:10,color:'var(--text-muted)',
                        fontWeight:500,minWidth:120,maxWidth:140,
                        whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                      {TASK_NAMES[col.tk]||taskNames[col.tk]||col.tk}
                    </th>
                  );
                })}
              </tr>
            </thead>

            <tbody>
              {filteredModels.map((model,mi)=>(
                <tr key={model.key} onMouseEnter={()=>setHovRow(mi)} onMouseLeave={()=>setHovRow(null)}>
                  <td className="sticky s1 sep-right"
                    style={{background:stickyBg(mi),padding:'13px 16px',
                      borderBottom:'1px solid var(--border)',verticalAlign:'middle',transition:'background 0.1s'}}>
                    <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:12,fontWeight:600,
                      color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}
                      title={model.name}>{model.name}</div>
                  </td>
                  <td className="sticky s3 sep-right"
                    style={{background:stickyBg(mi),padding:'13px 8px',textAlign:'center',
                      borderBottom:'1px solid var(--border)',verticalAlign:'middle',transition:'background 0.1s'}}>
                    <span className="badge" style={{color:'#79c0ff',background:'rgba(121,192,255,0.1)'}}>{model.quant}</span>
                  </td>

                  {/* Overall cell */}
                  {(() => {
                    const s=overallStats.stats[mi];
                    const cmpModel = compareModelsByKey[model.key];
                    const cmpOverall = cmpModel ? (() => {
                      const cmpTasks = Object.values(cmpModel.tasks);
                      if (!cmpTasks.length) return null;
                      const avgTps    = cmpTasks.reduce((acc,t)=>acc+t.tps,0)/cmpTasks.length;
                      const totalSec  = cmpTasks.reduce((acc,t)=>acc+t.tps,0);
                      const notaTasks = cmpTasks.filter(t=>t.notaGeral!=null);
                      const avgNota   = notaTasks.length ? notaTasks.reduce((acc,t)=>acc+t.notaGeral,0)/notaTasks.length : null;
                      const sumTok    = cmpTasks.reduce((acc,t)=>acc+(t.tokens||0),0);
                      const tks       = totalSec > 0 ? sumTok / totalSec : 0;
                      return { avgTps, avgNota, sumTok, tks, sumTps: totalSec };
                    })() : null;
                    if (!s) return (
                      <td style={{padding:'11px 14px',borderRight:'2px solid var(--border-sep)',
                        borderBottom:'1px solid var(--border)',textAlign:'center',
                        color:'var(--text-dim)',fontFamily:'JetBrains Mono,monospace',fontSize:12}}>—</td>
                    );
                    const nc  = s.avgNota!=null ? notaColor(s.avgNota) : 'var(--text-dim)';
                    const tc  = tokColor(s.sumTok, overallStats.maxSumTok);
                    const isBest = overallStats.bestIdx===mi;
                    return (
                      <td style={{background:hovRow===mi?'var(--bg-hover)':'transparent',
                        padding:'9px 8px',borderRight:'2px solid var(--border-sep)',
                        borderBottom:'1px solid var(--border)',
                        verticalAlign:'top',transition:'background 0.1s',
                        position:'relative',minWidth:80,maxWidth:180}}>
                        {isBest&&visibleMetrics.qsi&&<span style={{position:'absolute',top:5,right:7,fontSize:9,color:'var(--text-muted)',opacity:.85}}>▲</span>}
                        {/* Posição QSI → exibe nota */}
                        {visibleMetrics.qsi && (
                          <div style={{marginBottom:5,padding:'4px 6px',borderRadius:4,background:'rgba(255,255,255,0.04)'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:8,fontWeight:600,color:'var(--text-dim)',letterSpacing:'.05em',textTransform:'uppercase'}}>nota</span>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:14,fontWeight:700,color:nc,lineHeight:1}}>{s.avgNota!=null?s.avgNota.toFixed(1):'—'}</span>
                            </div>
                            <Bar val={s.avgNota||0} max={10} color={nc} h={2}/>
                            {cmpOverall && (
                              <div style={{marginTop:4,paddingTop:4,borderTop:'1px solid var(--border-subtle)',display:'flex',justifyContent:'space-between',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-muted)'}}>
                                <span style={{color:cmpOverall.avgNota!=null?notaColor(cmpOverall.avgNota):'var(--text-dim)'}}>{cmpOverall.avgNota!=null?cmpOverall.avgNota.toFixed(1):'—'}</span>
                                <span style={{color:(s.avgNota||0) >= (cmpOverall.avgNota||0) ? '#56d364' : '#f85149'}}>{fmtDelta(s.avgNota, cmpOverall.avgNota)}</span>
                              </div>
                            )}
                          </div>
                        )}
                        {/* Posição nota → exibe tokens (menos = melhor) */}
                        {visibleMetrics.nota && (
                          <>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:12,fontWeight:600,color:tc}}>{s.sumTok?s.sumTok.toLocaleString('pt-BR'):'—'}</span>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>tok total</span>
                            </div>
                            <Bar val={s.sumTok} max={overallStats.maxSumTok||1} color={tc} h={2}/>
                            {cmpOverall && (
                              <div style={{marginTop:3,display:'flex',justifyContent:'space-between',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-muted)'}}>
                                <span style={{color:tokColor(cmpOverall.sumTok, overallStats.maxSumTok)}}>{fmtTokens(cmpOverall.sumTok)}</span>
                                <span style={{color:(s.sumTok||0) <= (cmpOverall.sumTok||0) ? '#56d364' : '#f85149'}}>{fmtDelta(s.sumTok, cmpOverall.sumTok, 0)}</span>
                              </div>
                            )}
                          </>
                        )}
                        {visibleMetrics.tps && (
                          <>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:4}}>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:12,fontWeight:600,color:'var(--text)'}}>{fmtMmSs(s.sumTps)}</span>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>total</span>
                            </div>
                            <Bar val={s.sumTps} max={overallStats.maxSumTps||1} color='var(--text-muted)' h={2}/>
                            {cmpOverall && (
                              <div style={{marginTop:3,display:'flex',justifyContent:'space-between',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-muted)'}}>
                                <span>{fmtMmSs(cmpOverall.sumTps)}</span>
                                <span style={{color:(s.sumTps||0)<=(cmpOverall.sumTps||0)?'#56d364':'#f85149'}}>{fmtDelta(s.sumTps, cmpOverall.sumTps)}</span>
                              </div>
                            )}
                          </>
                        )}
                        {visibleMetrics.cost && (() => {
                          const mpr = modelPrices[modelKeyToOr(model.key)];
                          const tasks = Object.values(model.tasks);
                          const totalCost = tasks.reduce((acc,t)=>acc+(computeCost(t.inputTok,t.outputTok,mpr)||0),0);
                          const costStr = fmtCost(totalCost);
                          if (!costStr) return null;
                          return (
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:4}}>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:12,fontWeight:600,color:'#e3b341'}}>{costStr}</span>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>USD</span>
                            </div>
                          );
                        })()}
                      </td>
                    );
                  })()}

                  {cols.map(col=>{
                    const [r,gg,b]=hexRgb(col.g.color);
                    const bg=hovRow===mi
                      ?(col.type==='group'?`rgba(${r},${gg},${b},0.1)`:'var(--bg-hover)')
                      :(col.type==='group'?col.g.bg:'transparent');
                    const borderR=col.type==='group'||col.last?'2px solid var(--border-sep)':'1px solid var(--border-subtle)';

                    if (col.type==='group') {
                      const vt=col.g.tasks.filter(t=>model.tasks[t]);
                      const cmpModel = compareModelsByKey[model.key];
                      const cmpTasks = cmpModel ? col.g.tasks.filter(t=>cmpModel.tasks[t]) : [];
                      const isBest=groupBest[col.g.key]===mi;
                      if (!vt.length) return (
                        <td key={col.g.key} style={{background:bg,padding:'13px 14px',
                          borderRight:borderR,borderBottom:'1px solid var(--border)',
                          textAlign:'center',color:'var(--text-dim)',fontFamily:'JetBrains Mono,monospace',
                          fontSize:12,transition:'background 0.1s'}}>—</td>
                      );
                      // Célula de grupo diagnóstico: mostra contagem de checks ✓/✗
                      if (col.g.diag) {
                        const ok  = vt.filter(t=>!model.tasks[t].hasError).length;
                        const tot = vt.length;
                        const allOk = ok===tot;
                        const ckColor = allOk?'#56d364':ok>0?'#e3b341':'#f85149';
                        return (
                          <td key={col.g.key} className="data-cell"
                            onClick={()=>openModal('group',mi,col.g.key)}
                            style={{background:bg,padding:'11px 14px',
                              borderRight:borderR,borderBottom:'1px solid var(--border)',
                              verticalAlign:'middle',textAlign:'center',
                              transition:'background 0.1s',cursor:'pointer',minWidth:56}}>
                            <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:15,fontWeight:700,color:ckColor}}>
                              {ok}/{tot}
                            </span>
                            <div style={{fontSize:9,color:'var(--text-dim)',marginTop:2}}>checks ✓</div>
                          </td>
                        );
                      }
                      const notaTs   = vt.filter(t=>model.tasks[t].notaGeral!=null);
                      const avgNota  = notaTs.length ? notaTs.reduce((s,t)=>s+model.tasks[t].notaGeral,0)/notaTs.length : null;
                      const avgQsi   = vt.reduce((s,t)=>s+qsIndex(model.tasks[t].tps,null,model.tasks[t].notaGeral),0)/vt.length;
                      const sumTps   = vt.reduce((s,t)=>s+model.tasks[t].tps,0);
                      const sumTok   = vt.reduce((s,t)=>s+(model.tasks[t].tokens||0),0);
                      const cmpAvgNota = cmpTasks.length ? cmpTasks.filter(t=>cmpModel.tasks[t].notaGeral!=null).reduce((s,t)=>s+cmpModel.tasks[t].notaGeral,0)/cmpTasks.length : null;
                      const cmpAvgQsi  = cmpTasks.length ? cmpTasks.reduce((s,t)=>s+qsIndex(cmpModel.tasks[t].tps,null,cmpModel.tasks[t].notaGeral),0)/cmpTasks.length : null;
                      const cmpSumTps  = cmpTasks.length ? cmpTasks.reduce((s,t)=>s+cmpModel.tasks[t].tps,0) : null;
                      const cmpSumTok  = cmpTasks.length ? cmpTasks.reduce((s,t)=>s+(cmpModel.tasks[t].tokens||0),0) : null;
                      const maxSumTps  = Math.max(...filteredModels.map(m=>{const ts=col.g.tasks.filter(t=>m.tasks[t]);return ts.reduce((s,t)=>s+m.tasks[t].tps,0);}),1);
                      const maxSumTok  = Math.max(...filteredModels.map(m=>{const ts=col.g.tasks.filter(t=>m.tasks[t]);return ts.reduce((s,t)=>s+(m.tasks[t].tokens||0),0);}),1);
                      const nc=notaColor(avgNota); const qc=qsiColor(avgQsi); const tc=tokColor(sumTok,maxSumTok);
                      return (
                        <td key={col.g.key} className="data-cell"
                          onClick={()=>openModal('group',mi,col.g.key)}
                          style={{background:bg,padding:'11px 14px',
                            borderRight:borderR,borderBottom:'1px solid var(--border)',
                            verticalAlign:'top',transition:'background 0.1s',position:'relative',minWidth:col.g.diag?56:130}}>
                          {isBest&&visibleMetrics.qsi&&<span style={{position:'absolute',top:5,right:7,fontSize:9,color:col.g.color,opacity:.85}}>▲</span>}
                          {visibleMetrics.qsi && (
                            <div style={{marginBottom:6,padding:'5px 7px',borderRadius:5,background:`rgba(${r},${gg},${b},0.08)`}}>
                              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,fontWeight:600,color:'var(--text-dim)',letterSpacing:'.05em',textTransform:'uppercase'}}>nota</span>
                                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:16,fontWeight:700,color:nc,lineHeight:1}}>{avgNota!=null?avgNota.toFixed(1):'—'}</span>
                              </div>
                              <Bar val={avgNota||0} max={10} color={nc} h={3}/>
                              {cmpAvgNota!=null && (
                                <div style={{marginTop:4,paddingTop:4,borderTop:'1px solid var(--border-subtle)',display:'flex',justifyContent:'space-between',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-muted)'}}>
                                  <span style={{color:notaColor(cmpAvgNota)}}>{cmpAvgNota.toFixed(1)}</span>
                                  <span style={{color:avgNota >= cmpAvgNota ? '#56d364' : '#f85149'}}>{fmtDelta(avgNota, cmpAvgNota)}</span>
                                </div>
                              )}
                            </div>
                          )}
                          {visibleMetrics.nota && (
                            <>
                              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:13,fontWeight:600,color:tc}}>{fmtTokens(sumTok)}</span>
                                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>tok total</span>
                              </div>
                              <Bar val={sumTok} max={maxSumTok||1} color={tc} h={2}/>
                              {cmpSumTok!=null && (
                                <div style={{marginTop:3,display:'flex',justifyContent:'space-between',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-muted)'}}>
                                  <span style={{color:tokColor(cmpSumTok,maxSumTok)}}>{fmtTokens(cmpSumTok)}</span>
                                  <span style={{color:sumTok<=cmpSumTok?'#56d364':'#f85149'}}>{fmtDelta(sumTok,cmpSumTok,0)}</span>
                                </div>
                              )}
                            </>
                          )}
                          {visibleMetrics.tps && (
                            <>
                              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:5}}>
                                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:13,fontWeight:600,color:'var(--text)'}}>{fmtMmSs(sumTps)}</span>
                                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>total</span>
                              </div>
                              <Bar val={sumTps} max={maxSumTps||1} color={col.g.color} h={2}/>
                              {cmpSumTps!=null && (
                                <div style={{marginTop:3,display:'flex',justifyContent:'space-between',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-muted)'}}>
                                  <span>{fmtMmSs(cmpSumTps)}</span>
                                  <span style={{color:sumTps<=cmpSumTps?'#56d364':'#f85149'}}>{fmtDelta(sumTps,cmpSumTps)}</span>
                                </div>
                              )}
                            </>
                          )}
                          {visibleMetrics.cost && (() => {

                            const grpCost = vt.reduce((acc,t)=>acc+(computeCost(model.tasks[t].inputTok,model.tasks[t].outputTok,mpr)||0),0);
                            const cs = fmtCost(grpCost);
                            if (!cs) return null;
                            return (
                              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:4}}>
                                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:12,fontWeight:600,color:'#e3b341'}}>{cs}</span>
                                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>USD</span>
                              </div>
                            );
                          })()}
                        </td>
                      );
                    }

                    const td=model.tasks[col.tk];

                    if (!td) return (
                      <td key={`${col.g.key}-${col.tk}`} className="col-fade"

                          borderRight:borderR,borderBottom:'1px solid var(--border)',
                          textAlign:'center',color:'var(--text-dim)',fontFamily:'JetBrains Mono,monospace',

                          onClick={()=>openModal('task',mi,col.g.key,col.tk)}
                          style={{background:bg,padding:'9px 10px',

                        onClick={()=>openModal('task',mi,col.g.key,col.tk)}
                        style={{background:bg,padding:'9px 10px',
                          borderRight:borderR,borderBottom:'1px solid var(--border)',
                          verticalAlign:'top',transition:'background 0.1s',position:'relative',minWidth:120}}>
                        {isBest&&visibleMetrics.qsi&&<span style={{position:'absolute',top:4,right:5,fontSize:9,color:col.g.color,opacity:.85}}>▲</span>}
                        {visibleMetrics.qsi && (
                          <div style={{marginBottom:5,padding:'4px 6px',borderRadius:4,background:`rgba(${r},${gg},${b},0.08)`}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:8,fontWeight:600,color:'var(--text-dim)',letterSpacing:'.05em',textTransform:'uppercase'}}>nota</span>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:14,fontWeight:700,color:nc,lineHeight:1}}>{td.notaGeral!=null?td.notaGeral.toFixed(1):'—'}</span>
                            </div>
                            <Bar val={td.notaGeral||0} max={10} color={nc} h={2}/>
                            {cmpTd && (
                              <div style={{marginTop:4,paddingTop:4,borderTop:'1px solid var(--border-subtle)',display:'flex',justifyContent:'space-between',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-muted)'}}>
                                <span style={{color:cmpTd.notaGeral!=null?notaColor(cmpTd.notaGeral):'var(--text-dim)'}}>{cmpTd.notaGeral!=null?cmpTd.notaGeral.toFixed(1):'—'}</span>
                                <span style={{color:(td.notaGeral||0)>=(cmpTd.notaGeral||0)?'#56d364':'#f85149'}}>{fmtDelta(td.notaGeral,cmpTd.notaGeral)}</span>
                              </div>
                            )}
                          </div>
                        )}
                        {visibleMetrics.nota && (
                          <>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:12,fontWeight:600,color:tokColor(td.tokens,maxTok[col.tk])}}>
                                {td.tokens?td.tokens.toLocaleString('pt-BR'):'—'}
                              </span>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>tokens</span>
                            </div>
                            <Bar val={td.tokens||0} max={maxTok[col.tk]||1} color={tokColor(td.tokens,maxTok[col.tk])} h={2}/>
                            {cmpTd && (
                              <div style={{marginTop:3,display:'flex',justifyContent:'space-between',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-muted)'}}>
                                <span style={{color:tokColor(cmpTd.tokens,maxTok[col.tk])}}>{cmpTd.tokens?fmtTokens(cmpTd.tokens):'—'}</span>
                                <span style={{color:(td.tokens||0)<=(cmpTd.tokens||0)?'#56d364':'#f85149'}}>{fmtDelta(td.tokens,cmpTd.tokens,0)}</span>
                              </div>
                            )}
                          </>
                        )}
                        {visibleMetrics.tps && (
                          <>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:4}}>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:12,fontWeight:600,color:'var(--text)'}}>{fmtMmSs(td.tps)}</span>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>mm:ss</span>
                            </div>
                            <Bar val={td.tps} max={mt} color={col.g.color} h={2}/>
                            {cmpTd && (
                              <div style={{marginTop:3,display:'flex',justifyContent:'space-between',fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-muted)'}}>
                                <span>{fmtMmSs(cmpTd.tps)}</span>
                                <span>{fmtDelta(td.tps, cmpTd.tps)}</span>
                              </div>
                            )}
                          </>
                        )}
                        {visibleMetrics.cost && (() => {
                          const mpr = modelPrices[modelKeyToOr(model.key)];
                          const taskCost = computeCost(td.inputTok, td.outputTok, mpr);
                          const cs = fmtCost(taskCost);
                          if (!cs) return null;
                          return (
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginTop:4}}>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,fontWeight:600,color:'#e3b341'}}>{cs}</span>
                              <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:'var(--text-dim)'}}>USD</span>
                            </div>
                          );
                        })()}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Footer */}
        <div style={{marginTop:14,display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8,fontSize:10,color:'var(--text-dim)'}}>
          <span>Clique nas células para ver critérios, artefatos e justificativas · ▲ melhor Score por coluna</span>
          <span>Score = nota/10 × 100 · Nota = avaliação LLM 0–10 · Tempo = duração da task</span>
        </div>

        {/* Modal */}
        {modal && (
          <Modal data={modal} models={models} visibleMetrics={visibleMetrics} modelPrices={modelPrices} onClose={()=>setModal(null)} onNavigate={setModal}/>
        )}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
